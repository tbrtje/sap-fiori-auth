[project]
name = "sap-zeit"
version = "0.1.0"
description = "CLI für die SAP-Zeiterfassung (CATS) mit Kerberos-SSO"
requires-python = ">=3.10"
dependencies = [
  "requests",
  "truststore",
  "requests-gssapi; sys_platform != 'win32'",
  "requests-negotiate-sspi; sys_platform == 'win32'",
  "playwright",
]

[dependency-groups]
# Build-Abhängigkeiten für sdists (gssapi hat unter Linux kein Wheel), damit auch sie gelockt sind.
build = ["cython"]

[project.scripts]
zeit = "zeit:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["zeit"]
